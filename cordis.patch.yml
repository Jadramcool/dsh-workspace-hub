# dsh-workspace-hub bundle patch: inserts the dual-face plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# dsh.bundle.patch manifest field) over dsh-base; activate with
#   dsh plugin --profile <name> add link:<path>/dsh-workspace-hub
# or, after publishing to npm,
#   dsh plugin --profile <name> add dsh-workspace-hub
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (/api/wsfm routes), and the dsh.client declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/dsh-workspace-hub/client.js) load in the web GUI.
- insert:
    - id: workspace-hub
      name: 'dsh-workspace-hub'
